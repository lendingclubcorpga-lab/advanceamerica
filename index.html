<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Portal</title>
    <!-- Official Supabase Frontend SDK Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            background: #0f172a; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .progress-bar {
            width: 100%;
            background: #334155;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 25%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
        .form-step {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .form-step.active {
            display: block;
            opacity: 1;
        }
        h2 { margin-top: 0; color: #60a5fa; font-size: 1.5rem; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus { border-color: #3b82f6; outline: none; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 25px; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-back { background: #475569; color: white; }
        .btn-back:hover { background: #334155; }
        .btn-next { background: #3b82f6; color: white; margin-left: auto; }
        .btn-next:hover { background: #2563eb; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <form id="applicationForm" onsubmit="return false;">
            <!-- STEP 1: Basic Information -->
            <div class="form-step active" id="step1">
                <h2>Basic Information</h2>
                <label>First Name</label>
                <input type="text" id="firstName" required>
                <label>Last Name</label>
                <input type="text" id="lastName" required>
            </div>

            <!-- STEP 2: Contact Details -->
            <div class="form-step" id="step2">
                <h2>Contact Details</h2>
                <label>Primary Phone Number</label>
                <input type="text" id="phone" placeholder="Enter phone number" required>
                <label>Alternate Phone Number</label>
                <input type="text" id="altPhone" placeholder="Optional phone number">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <!-- STEP 3: Employment Details -->
            <div class="form-step" id="step3">
                <h2>Employment Details</h2>
                <label>Employer Name</label>
                <input type="text" id="employerName" required>
                <label>Employer Phone Number</label>
                <input type="text" id="employerPhone" placeholder="Enter work phone number" required>
            </div>

            <!-- STEP 4: Address Details -->
            <div class="form-step" id="step4">
                <h2>Address</h2>
                <label>Street Address</label>
                <input type="text" id="address" required>
                <label>City</label>
                <input type="text" id="city" required>
                <label>State</label>
                <input type="text" id="state" required>
                <label>Zip Code</label>
                <input type="text" id="zip" required>
            </div>

            <div class="btn-group">
                <button type="button" id="backBtn" class="btn-back hidden">Back</button>
                <button type="button" id="nextBtn" class="btn-next">Continue</button>
            </div>
        </form>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://supabase.com/dashboard/project/xjzhhsdiiyecupjaytjj/settings/api-keys";
        const SUPABASE_ANON_KEY = "sb_secret_F6OrFHehbI4JiMvZSC1Uzw_maf_kkEI";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStep = 1;
        const totalSteps = 4;

        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const progressFill = document.getElementById('progressFill');

        nextBtn.addEventListener('click', () => {
            const currentStepEl = document.getElementById(`step${currentStep}`);
            const inputs = currentStepEl.querySelectorAll('input');
            
            let allValid = true;
            inputs.forEach(input => {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    allValid = false;
                }
            });

            if (!allValid) return;

            if (currentStep < totalSteps) {
                currentStepEl.classList.remove('active');
                currentStep++;
                
                const nextStepEl = document.getElementById(`step${currentStep}`);
                nextStepEl.classList.add('active');
                
                updateFormUI();
            } else {
                submitToSupabase();
            }
        });

        backBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                document.getElementById(`step${currentStep}`).classList.remove('active');
                currentStep--;
                document.getElementById(`step${currentStep}`).classList.add('active');
                updateFormUI();
            }
        });

        function updateFormUI() {
            progressFill.style.width = `${(currentStep / totalSteps) * 100}%`;

            if (currentStep === 1) {
                backBtn.classList.add('hidden');
            } else {
                backBtn.classList.remove('hidden');
            }

            if (currentStep === totalSteps) {
                nextBtn.innerText = "Submit Application";
                nextBtn.style.background = "#10b981";
            } else {
                nextBtn.innerText = "Continue";
                nextBtn.style.background = "#3b82f6";
            }
        }

        // --- DATABASE SUBMISSION ---
        async function submitToSupabase() {
            nextBtn.disabled = true;
            nextBtn.innerText = "Submitting...";

            const payload = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                alt_phone: document.getElementById('altPhone').value,
                email: document.getElementById('email').value,
                employer_name: document.getElementById('employerName').value,
                employer_phone: document.getElementById('employerPhone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip: document.getElementById('zip').value
            };

            const { data, error } = await _supabase
                .from('applications')
                .insert([payload]);

            if (error) {
                alert("Database Submission Failed: " + error.message);
                nextBtn.disabled = false;
                nextBtn.innerText = "Submit Application";
            } else {
                alert("Application Successfully Stored in Supabase!");
                window.location.reload();
            }
        }
    </script>
</body>
</html>
